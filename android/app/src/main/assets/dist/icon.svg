<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background base rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Inner circle container -->
  <circle cx="256" cy="256" r="130" fill="#1e1f26" stroke="rgba(251,191,36,0.3)" stroke-width="6" filter="url(#shadow)" />

  <!-- Modern Play Triangle -->
  <polygon points="225,185 330,256 225,327" fill="url(#goldGrad)" />

  <!-- Stream signal waves on top right -->
  <path d="M 330 160 A 80 80 0 0 1 380 210" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 345 135 A 115 115 0 0 1 415 205" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity="0.5" />
</svg>
